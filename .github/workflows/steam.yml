# Every push to main: check the data, run a quick crash check, export the
# Windows build (on Linux) and upload it to Steam (app 5441720, depot
# 5441721) with SteamCMD on a Mac, the same build tools/steam_release.sh
# makes by hand.
#
# Setup and secrets: tools/steam/STEAMWORKS.md -> "Automatic builds".
#   secrets.STEAM_USERNAME    the Steam account with build rights
#   secrets.STEAM_CONFIG_VDF  SteamCMD's saved login (config.vdf), base64
#   secrets.FEEDBACK_WEBHOOK  optional: the Discord webhook stamped into the build
#   vars.STEAM_BRANCH         optional: a beta branch to set each build live on.
#                             Empty = upload only (Steam won't let SteamCMD set the
#                             default branch live: do that on the Builds page).
#
# Skip a push with [skip ci] in the commit message. Run one by hand from the
# Actions tab (Steam build -> Run workflow).
name: Steam build

on:
  push:
    branches: [main]
  workflow_dispatch:

# one upload at a time; a newer push waits rather than cancelling one mid-upload
concurrency:
  group: steam-upload
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7"
  GODOT_TEMPLATES_DIR: "4.7.stable"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      desc: ${{ steps.export.outputs.desc }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }} and its export templates
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -sSfL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSfL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip -d "$HOME/godot"
          mv "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/godot/godot"
          dest="$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATES_DIR"
          mkdir -p "$dest"
          unzip -q templates.tpz -d "$HOME/tpl"
          mv "$HOME"/tpl/templates/* "$dest/"
          echo "GODOT=$HOME/godot/godot" >> "$GITHUB_ENV"

      - name: Import the project
        run: $GODOT --headless --path . --import > import.log 2>&1 || (tail -50 import.log; exit 1)

      - name: Check the data (every reference resolves)
        run: $GODOT --headless --path . -s tools/validate_data.gd

      # The combat rule tests aren't run here on purpose (Logan, 2026-10-14):
      # only real breakage stops a build. A few simulated runs catch script
      # errors that would crash a fight.
      - name: Crash check (a few simulated runs)
        run: |
          $GODOT --headless --path . -s tools/balance_sim.gd -- 3 > sim.log 2>&1 || true
          if grep -q "SCRIPT ERROR\|Parse Error" sim.log; then
            grep -A3 "SCRIPT ERROR\|Parse Error" sim.log | head -40
            exit 1
          fi
          echo "ok ($(grep -c clear sim.log) mission x bot lines)"

      - name: Export Windows
        id: export
        env:
          FEEDBACK_WEBHOOK: ${{ secrets.FEEDBACK_WEBHOOK }}
        run: |
          stamp="$(date -u '+%Y-%m-%d %H:%M') UTC"
          commit="$(git rev-parse --short HEAD)"
          printf '{"stamp": "%s", "commit": "%s", "feedback_webhook": "%s"}\n' "$stamp" "$commit" "${FEEDBACK_WEBHOOK:-}" > build_info.json
          mkdir -p build/steam/windows
          $GODOT --headless --path . --export-release "Windows" build/steam/windows/CollimatorsFrontlines.exe > export.log 2>&1 || (tail -50 export.log; exit 1)
          rm -f build_info.json
          test -f build/steam/windows/CollimatorsFrontlines.exe || (tail -50 export.log; echo "no .exe"; exit 1)
          test -f build/steam/windows/steam_api64.dll || (echo "steam_api64.dll is missing from the build"; exit 1)
          ls -la build/steam/windows
          desc="v$(grep -m1 '^config/version=' project.godot | cut -d'"' -f2) $stamp ($commit) $(git log -1 --format=%s | cut -c1-60)"
          echo "desc=${desc//\"/\'}" >> "$GITHUB_OUTPUT"

      - name: Hand the build to the upload job
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/steam/windows
          retention-days: 7

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            import.log
            sim.log
            export.log
          if-no-files-found: ignore

  # The upload runs on a Mac, with Mac SteamCMD: Steam's saved login
  # (STEAM_CONFIG_VDF, made on Logan's Mac) wasn't accepted by Linux SteamCMD
  # ("Cached credentials not found", 2026-10-14). No stdin, so a bad login
  # fails rather than waiting for a password.
  upload:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: build/steam/windows

      - name: Upload to Steam
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
          STEAM_BRANCH: ${{ vars.STEAM_BRANCH }}
          DESC: ${{ needs.build.outputs.desc }}
        run: |
          SC="$HOME/steamcmd"
          mkdir -p "$SC"
          curl -sSfL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_osx.tar.gz | tar xz -C "$SC"
          "$SC/steamcmd.sh" +quit < /dev/null > steamcmd_update.log 2>&1 || true
          CFG="$HOME/Library/Application Support/Steam/config"
          mkdir -p "$CFG"
          printf '%s' "$STEAM_CONFIG_VDF" | base64 -D > "$CFG/config.vdf"
          OUT="$GITHUB_WORKSPACE/build/steam"
          test -f "$OUT/windows/CollimatorsFrontlines.exe"
          cat > "$OUT/app_build.vdf" <<VDF
          "AppBuild"
          {
          	"AppID" "5441720"
          	"Desc" "$DESC"
          	"SetLive" "$STEAM_BRANCH"
          	"ContentRoot" "$OUT"
          	"BuildOutput" "$OUT/output"
          	"Depots"
          	{
          		"5441721" { "FileMapping" { "LocalPath" "windows/*" "DepotPath" "." "Recursive" "1" } }
          	}
          }
          VDF
          set +e
          "$SC/steamcmd.sh" +login "$STEAM_USERNAME" +run_app_build "$OUT/app_build.vdf" +quit < /dev/null 2>&1 | tee upload.log
          set -e
          if grep -q "Successfully finished AppID 5441720 build" upload.log; then
            grep -oE "BuildID [0-9]+" upload.log | tail -1
            if [ -n "$STEAM_BRANCH" ]; then echo "Live on '$STEAM_BRANCH'."; else echo "Uploaded. Set it live: https://partner.steamgames.com/apps/builds/5441720"; fi
          else
            if grep -qiE "Cached credentials not found|Invalid Password|Two-factor|Steam Guard" upload.log; then
              echo "::error::Steam login failed: refresh STEAM_CONFIG_VDF (tools/steam_release.sh --login, then tools/steam/ci_login_secret.sh)."
            fi
            exit 1
          fi

      - name: Keep the upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upload-logs
          path: |
            upload.log
            steamcmd_update.log
          if-no-files-found: ignore
